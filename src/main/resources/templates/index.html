<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<div th:replace="~{fragments/layout :: header('home')}"></div>
<main>
    <form th:action="@{/}" method="get" class="toolbar">
        <label for="zone">Bidding zone</label>
        <select id="zone" name="zone" onchange="this.form.submit()">
            <option value="EE" th:selected="${selectedZone.name() == 'EE'}">
                Estonia (EE)
            </option>
            <option value="LV" th:selected="${selectedZone.name() == 'LV'}">
                Latvia (LV)
            </option>
            <option value="LT" th:selected="${selectedZone.name() == 'LT'}">
                Lithuania (LT)
            </option>
        </select>
    </form>
    <p class="headline" th:if="${cheapestTime != null}"
       th:text="|Cheapest hour today: ${cheapestTime}, ${cheapestPrice} €/kWh|">
        Cheapest hour today: 03:00, 0.0340 €/kWh
    </p>
    <p class="headline" th:if="${cheapestTime == null}">No prices for today yet.</p>

    <div class="home-grid">
        <div class="card">
            <h2 style="margin-top:0" th:text="|Today's prices (${selectedZone})|">Today's prices</h2>
            <div th:if="${!slots.isEmpty()}">
                <div th:replace="~{fragments/price-chart :: chart(${slots}, ${ticks})}"></div>
            </div>
            <p class="muted" th:if="${slots.isEmpty()}">Nothing to show yet.</p>
        </div>

        <div class="card">
            <h2 style="margin-top:0">Next planned run</h2>
            <div th:if="${nextRun != null}">
                <p style="margin:0;font-weight:700" th:text="${nextRun.applianceName}">Dishwasher</p>
                <p style="margin:4px 0" th:text="${nextRun.when}">Thu 5 Nov, 02:00–03:30</p>
                <p class="muted" style="margin:0" th:text="|${nextRun.cost} €|">0.12 €</p>
            </div>
            <div th:if="${nextRun == null}">
                <p class="muted">Nothing planned</p>
                <a class="btn btn-primary" th:href="@{/plan}">Plan a run</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
