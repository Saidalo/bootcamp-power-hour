spring.application.name=powerhour
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
logging.level.root=INFO
logging.level.com.bootcamp.powerhour=DEBUG
logging.file.name=logs/powerhour.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

elering.base-url=https://dashboard.elering.ee
elering.connect-timeout-ms=5000
elering.read-timeout-ms=10000
elering.max-attempts=3
elering.retry-delay-ms=2000

# Made-up prices so the UI works without Elering (see SamplePriceSeeder)
powerhour.sample-prices.enabled=true

elering.import-cron=0 0/15 14-16 * * *

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**