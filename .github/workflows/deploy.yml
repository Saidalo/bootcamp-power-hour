name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      container_name:
        description: 'Docker container name'
        required: false
        default: 'acn-power-hour-team-3'
      server_port:
        description: 'Application port'
        required: false
        default: '3300'
      startup_sleep_seconds:
        description: 'Seconds to wait after starting the container'
        required: false
        default: '5'

concurrency:
  group: deploy-team-3
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      APP_CONTAINER_NAME: ${{ github.event.inputs.container_name || 'acn-power-hour-team-3' }}
      APP_IMAGE_NAME: acn-power-hour-team-3
      DB_CONTAINER_NAME: acn-power-hour-team-3-db
      DOCKER_NETWORK: acn-power-hour-team-3-net
      DB_USERNAME: powerhour

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Extract deployment information
        id: deployment-info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          COMMIT="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          PORT_INPUT="${{ github.event.inputs.server_port }}"
          if [ -z "$PORT_INPUT" ]; then
            PORT_INPUT="3300"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "server_port=$PORT_INPUT" >> "$GITHUB_OUTPUT"

          echo "Deployment Info:"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT"
          echo "  Timestamp: $TIMESTAMP"
          echo "  Port: $PORT_INPUT"

      - name: Resolve build artifact
        id: build-artifact
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No packaged jar found in target/"
            ls -la target || true
            exit 1
          fi
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Resolved jar: $JAR_FILE"

      - name: Check Docker availability
        run: docker version

      - name: Build application image
        env:
          JAR_FILE: ${{ steps.build-artifact.outputs.jar_file }}
          APP_IMAGE_TAG: ${{ env.APP_IMAGE_NAME }}:${{ steps.deployment-info.outputs.commit }}
        run: |
          docker build \
            --build-arg JAR_FILE=$JAR_FILE \
            -t $APP_IMAGE_TAG \
            -t $APP_IMAGE_NAME:latest \
            .

      - name: Start Postgres (if not running)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "Missing DB_PASSWORD secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          
          docker network create $DOCKER_NETWORK || true

          if ! docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER_NAME"; then
            docker rm -f $DB_CONTAINER_NAME || true
            docker run -d \
              --name $DB_CONTAINER_NAME \
              --network $DOCKER_NETWORK \
              --restart unless-stopped \
              -e POSTGRES_DB=powerhour \
              -e POSTGRES_USER="$DB_USERNAME" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -v acn-power-hour-team-3-pgdata:/var/lib/postgresql/data \
              postgres:17
          fi

          for i in {1..30}; do
            if docker exec $DB_CONTAINER_NAME pg_isready -U "$DB_USERNAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          docker logs $DB_CONTAINER_NAME || true
          exit 1

      - name: Stop existing application (if running)
        continue-on-error: true
        run: |
          docker rm -f $APP_CONTAINER_NAME || true
          sleep 2

      - name: Start application container
        env:
          SERVER_PORT: ${{ steps.deployment-info.outputs.server_port }}
          DEPLOYMENT_BRANCH: ${{ steps.deployment-info.outputs.branch }}
          DEPLOYMENT_COMMIT: ${{ steps.deployment-info.outputs.commit }}
          DEPLOYMENT_TIMESTAMP: ${{ steps.deployment-info.outputs.timestamp }}
          STARTUP_SLEEP_SECONDS: ${{ github.event.inputs.startup_sleep_seconds || '5' }}
          APP_IMAGE_TAG: ${{ env.APP_IMAGE_NAME }}:${{ steps.deployment-info.outputs.commit }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker run -d \
            --name $APP_CONTAINER_NAME \
            --network $DOCKER_NETWORK \
            --restart unless-stopped \
            -p $SERVER_PORT:$SERVER_PORT \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e SERVER_PORT=$SERVER_PORT \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://$DB_CONTAINER_NAME:5432/powerhour \
            -e DEPLOYMENT_BRANCH="$DEPLOYMENT_BRANCH" \
            -e DEPLOYMENT_COMMIT="$DEPLOYMENT_COMMIT" \
            -e DEPLOYMENT_TIMESTAMP="$DEPLOYMENT_TIMESTAMP" \
            $APP_IMAGE_TAG
          sleep "$STARTUP_SLEEP_SECONDS"
          echo "Application container started on port $SERVER_PORT"
          docker ps --filter "name=$APP_CONTAINER_NAME"

      - name: Verify deployment
        run: |
          for i in {1..30}; do
            if ! docker ps --format '{{.Names}}' | grep -qx "$APP_CONTAINER_NAME"; then
              echo "Application container is not running"
              docker logs $APP_CONTAINER_NAME || true
              exit 1
            fi

            if docker logs $APP_CONTAINER_NAME 2>&1 | grep -q "Started PowerhourApplication in"; then
              echo "Application container is running and Spring Boot has started"
              docker ps --filter "name=$APP_CONTAINER_NAME"
              exit 0
            fi

            echo "Attempt $i: Waiting for Spring Boot startup confirmation..."
            sleep 2
          done

          echo "Application did not report successful startup in logs"
          docker logs $APP_CONTAINER_NAME || true
          exit 1

      - name: Display application logs
        if: always()
        run: docker logs --tail 50 $APP_CONTAINER_NAME || true
